name: CI

on:
  push:
    branches: [main, FixBug]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (test:all)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-for-production
      MONGO_URI: mongodb://127.0.0.1:27017/ai_lms_ci
      MONGO_TEST_URI: mongodb://127.0.0.1:27017/ai_lms_test
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/27017) >/dev/null 2>&1 && echo "MongoDB sẵn sàng" && exit 0
            sleep 1
          done
          echo "MongoDB không sẵn sàng sau 30s" && exit 1

      - name: Run unit + integration tests
        run: npm run test:all

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # continue-on-error: repo hiện có ~616 lỗi lint tồn đọng từ trước (chủ yếu no-explicit-any),
      # chưa nằm trong phạm vi PR-12. Vẫn chạy để lộ diện số liệu, nhưng không chặn merge cho tới khi
      # có một PR dọn dẹp lint riêng đưa baseline về 0.
      - name: Lint (không chặn merge — xem ghi chú)
        run: npm run lint
        continue-on-error: true

      - name: Typecheck + build
        run: npm run build
